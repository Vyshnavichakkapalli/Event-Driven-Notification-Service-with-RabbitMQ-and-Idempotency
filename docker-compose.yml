version: '3.8'

services:
  db:
    image: postgres:15
    container_name: notification_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notifications
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: notification_rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: notification_app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MQ_HOST: rabbitmq
      MQ_PORT: 5672
      MQ_USER: guest
      MQ_PASS: guest
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: user
      DB_PASS: password
      DB_NAME: notifications
      MAX_RETRIES: 3
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
